server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TLS terminates at the proxy in front; keep redirects relative so they stay on https.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # One URL form: /path/ -> /path (query string is kept). Relative Location via absolute_redirect off.
    rewrite ^/(.+)/$ /$1 permanent;

    # Hashed build assets never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Pages and other files: always revalidate.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
