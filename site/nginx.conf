server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TLS terminates at the proxy in front; keep redirects relative so they stay on https.
    absolute_redirect off;
    server_tokens off;

    # Requests are already logged by the reverse proxy (rotated daily, see /privacy); no second copy here.
    access_log off;
    log_not_found off;

    # Also covers the trailing-slash redirect, which is answered before a location is chosen.
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # One URL form: /path/ -> /path (query string is kept). Relative Location via absolute_redirect off.
    rewrite ^/(.+)/$ /$1 permanent;

    # Hashed build assets never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # JOSM map paint style: .mapcss has no type in mime.types (it would be application/octet-stream).
    # `types` here replaces the whole table, so it lists every file type under /josm/.
    location /josm/ {
        types {
            text/plain mapcss;
            application/zip zip;
            image/svg+xml svg;
        }
        charset utf-8;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Pages and other files: always revalidate (the 404 page too, via error_page below).
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
