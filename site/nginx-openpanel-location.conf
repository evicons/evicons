# Statistics proxy, server level: browser -> POST /api/op/track -> OpenPanel (self-hosted, stats.landolsi.de).
# Variables from nginx-openpanel.conf.template. Only POST with a JSON body of at most 16 KB; the client ID is
# set here, not taken from the browser; only content type, user agent and origin are passed on, plus the
# truncated visitor IP. No cookies, no full IP, no logs (access_log off at server level).
location = /api/op/track {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;

    if ($op_client_id = "") {
        return 404;
    }
    if ($request_method != POST) {
        return 405;
    }
    if ($content_type !~* "^application/json") {
        return 415;
    }

    client_max_body_size 16k;
    client_body_buffer_size 16k;
    limit_req zone=openpanel burst=30 nodelay;
    limit_req_status 429;

    proxy_pass $op_upstream;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    proxy_connect_timeout 3s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;

    proxy_pass_request_headers off;
    proxy_set_header Host $proxy_host;
    proxy_set_header Content-Type "application/json";
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Origin $http_origin;
    proxy_set_header openpanel-client-id $op_client_id;
    proxy_set_header openpanel-client-ip $op_client_ip;
    proxy_hide_header Set-Cookie;
    proxy_ignore_headers Set-Cookie;
}
