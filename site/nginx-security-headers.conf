# Security headers on every response, error pages included (`always`). Included at server level and in
# each location, because an add_header in a location replaces the inherited ones.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Minimal CSP: no framing, no <base>/<object> injection, forms post only here. No script/style policy yet.
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
